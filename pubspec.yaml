name: stitch
description: Free, open source video editor for iOS and Android. Everything stays on your device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_tracking_transparency: ^2.0.7
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_mobile_ads: ^9.2.0
  hooks: ^2.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  pigeon: ^29.0.2
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false
  generate: true

  # Plugins come in through Swift Package Manager; no CocoaPods.
  config:
    enable-swift-package-manager: true

  assets:
    - assets/licenses/
    - assets/splash/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/sound_library/

  shaders:
    # Transition previews; generated by tool/gen_transitions.dart.
    - shaders/transitions/crossfade.frag
    - shaders/transitions/fadeToBlack.frag
    - shaders/transitions/fadeToWhite.frag
    - shaders/transitions/dissolve.frag
    - shaders/transitions/lumaFade.frag
    - shaders/transitions/slideLeft.frag
    - shaders/transitions/slideRight.frag
    - shaders/transitions/slideUp.frag
    - shaders/transitions/slideDown.frag
    - shaders/transitions/coverLeft.frag
    - shaders/transitions/coverRight.frag
    - shaders/transitions/revealLeft.frag
    - shaders/transitions/revealRight.frag
    - shaders/transitions/wipeLeft.frag
    - shaders/transitions/wipeRight.frag
    - shaders/transitions/wipeUp.frag
    - shaders/transitions/wipeDown.frag
    - shaders/transitions/softWipe.frag
    - shaders/transitions/clockWipe.frag
    - shaders/transitions/barnDoorHorizontal.frag
    - shaders/transitions/barnDoorVertical.frag
    - shaders/transitions/blinds.frag
    - shaders/transitions/stripes.frag
    - shaders/transitions/zoomIn.frag
    - shaders/transitions/zoomOut.frag
    - shaders/transitions/crossZoom.frag
    - shaders/transitions/spin.frag
    - shaders/transitions/swirl.frag
    - shaders/transitions/zoomThrough.frag
    - shaders/transitions/circleOpen.frag
    - shaders/transitions/circleClose.frag
    - shaders/transitions/diamond.frag
    - shaders/transitions/heart.frag
    - shaders/transitions/squares.frag
    - shaders/transitions/checkerboard.frag
    - shaders/transitions/blur.frag
    - shaders/transitions/flash.frag
    - shaders/transitions/lightLeak.frag
    - shaders/transitions/burn.frag
    - shaders/transitions/pixelate.frag
    - shaders/transitions/glitch.frag
    - shaders/transitions/rgbSplit.frag
    - shaders/transitions/noise.frag
    - shaders/transitions/mosaic.frag
    - shaders/transitions/ripple.frag
    - shaders/transitions/wave.frag
    - shaders/transitions/cube.frag
    - shaders/transitions/doorway.frag
    - shaders/transitions/kaleidoscope.frag
    - shaders/transitions/bounce.frag

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    # Fonts for text in the video (user content, not UI).
    - family: Anton
      fonts:
        - asset: assets/fonts/text/Anton-Regular.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/text/BebasNeue-Regular.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/text/DMSerifDisplay-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/text/Pacifico-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/text/SpaceMono-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/text/Montserrat-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/text/Poppins-SemiBold.ttf
          weight: 600
    - family: Oswald
      fonts:
        - asset: assets/fonts/text/Oswald-Bold.ttf
          weight: 700
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/text/ArchivoBlack-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/text/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/text/Lora-SemiBold.ttf
          weight: 600
    - family: AbrilFatface
      fonts:
        - asset: assets/fonts/text/AbrilFatface-Regular.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/text/Cinzel-Bold.ttf
          weight: 700
    - family: DancingScript
      fonts:
        - asset: assets/fonts/text/DancingScript-Bold.ttf
          weight: 700
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/text/GreatVibes-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/text/Caveat-Bold.ttf
          weight: 700
    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/text/PermanentMarker-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/text/Nunito-ExtraBold.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/text/Fredoka-SemiBold.ttf
          weight: 600
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/text/Comfortaa-Bold.ttf
          weight: 700
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/text/PressStart2P-Regular.ttf
    - family: Monoton
      fonts:
        - asset: assets/fonts/text/Monoton-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/text/VT323-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/text/Lobster-Regular.ttf
    - family: Bangers
      fonts:
        - asset: assets/fonts/text/Bangers-Regular.ttf
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/text/LuckiestGuy-Regular.ttf
    - family: Creepster
      fonts:
        - asset: assets/fonts/text/Creepster-Regular.ttf
