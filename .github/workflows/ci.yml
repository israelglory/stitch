name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test hook
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      # The caption model for the speech recognition tests (they skip
      # without it). Cached; the script checks its hash.
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: whisper-tiny-q8_0-c2085835
      - run: tool/fetch_test_model.sh
      - name: Test
        # Goldens run in the macOS job, where they were generated. The build
        # hook compiles whisper.cpp for this machine first.
        run: flutter test --coverage --exclude-tags golden

  android:
    name: Android build and engine tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native engine tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The one-minute 1080p export is a local speed report, too slow for CI.
          script: >-
            cd android && ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notClass=xyz.gloryolaifa.stitch.engine.EngineTests#reportExportSpeedOneMinute1080p

  ios:
    name: iOS build
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Golden tests
        run: flutter test --tags golden
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
      - run: flutter build ios --debug --no-codesign
      - name: Native engine tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:RunnerTests/EngineTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120
