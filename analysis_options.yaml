include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    # Pigeon's input: its parser needs the classic constructor syntax.
    - pigeons/**
    - build/**
    - android/**
    - ios/**
  errors:
    # Warnings fail CI; treat them as errors locally too.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Public API docs are required in design/ and engine/ by review, not by
    # lint, so feature code does not fill up with restating comments.
    public_member_api_docs: false
    # Mapping list elements with `a ? b : c` reads better than if/else
    # elements when every element is kept.
    prefer_if_elements_to_conditional_expressions: false
