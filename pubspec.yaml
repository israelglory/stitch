name: stitch
description: Free, open source video editor for iOS and Android. Everything stays on your device.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  pigeon: ^29.0.2
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false
  generate: true

  # Plugins come in through Swift Package Manager; no CocoaPods.
  config:
    enable-swift-package-manager: true

  assets:
    - assets/licenses/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
